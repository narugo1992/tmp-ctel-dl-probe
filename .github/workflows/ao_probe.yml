name: Asiaon Download Probe
on:
  workflow_dispatch:
    inputs:
      heavy_host:
        description: 'Host for the sustained download stage'
        default: 'pixeldrain'
      gd_endpoint:
        description: 'usercontent or uc (the gdown-style path)'
        default: 'usercontent'
      stages:
        description: 'Comma list of recent,old,scale,stab,full,cffi,gdrive,heavy,pw'
        default: 'recent,old'
# The probe runs third-party scripts fetched at run time (gofile's token generator), so it gets no
# write access and keeps no credentials. The repository holds no secrets.
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full || true
          pip install pyzipper cloudscraper pyquery lxml cryptography requests dateparser di-toolkit hbutils random_user_agent curl_cffi
      - name: Probe
        env:
          STAGES: ${{ github.event.inputs.stages || 'recent,old' }}
          THREADS: '8'
          HEAVY_HOST: ${{ github.event.inputs.heavy_host || 'pixeldrain' }}
          HEAVY_GB: '8'
          GD_ENDPOINT: ${{ github.event.inputs.gd_endpoint || 'usercontent' }}
        run: python -u ao_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ao-results
          path: ao_results.json
